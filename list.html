<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待辦清單</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f2f7ff;
        }
        .todo-item.completed .item-label {
            text-decoration: line-through;
            color: #6c757d;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 p-3">
    <div class="card shadow" style="width: 100%; max-width: 500px;">
        <div class="card-body p-4">
            <h1 class="card-title text-center mb-4 fs-3">我的待辦清單</h1>

            <div class="input-group mb-4">
                <input id="newTodoInput" type="text" class="form-control" placeholder="新增項目..." />
                <button id="addTodoButton" class="btn btn-primary">新增</button>
            </div>

            <ul id="todoList" class="list-group mb-2"></ul>
            <div id="emptyState" class="text-center text-secondary py-4">目前沒有待辦，請新增一個項目。</div>
        </div>
    </div>

    <script>
        const todoList = document.getElementById('todoList');
        const newTodoInput = document.getElementById('newTodoInput');
        const addTodoButton = document.getElementById('addTodoButton');
        const emptyState = document.getElementById('emptyState');

        const todos = [
            { text: '買牛奶', done: false },
            { text: '寫報告', done: false },
            { text: '運動30分鐘', done: false }
        ];

        function renderTodos() {
            todoList.innerHTML = '';
            if (todos.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex align-items-center justify-content-between todo-item' + (todo.done ? ' completed' : '');

                const label = document.createElement('label');
                label.className = 'form-check-label d-flex align-items-center gap-2 flex-grow-1 mb-0 item-label';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'form-check-input mt-0';
                checkbox.checked = todo.done;
                checkbox.addEventListener('change', () => {
                    todos[index].done = checkbox.checked;
                    renderTodos();
                });

                const text = document.createElement('span');
                text.textContent = todo.text;

                label.appendChild(checkbox);
                label.appendChild(text);

                const removeButton = document.createElement('button');
                removeButton.className = 'btn btn-danger btn-sm ms-2';
                removeButton.textContent = '刪除';
                removeButton.addEventListener('click', () => {
                    todos.splice(index, 1);
                    renderTodos();
                });

                li.appendChild(label);
                li.appendChild(removeButton);
                todoList.appendChild(li);
            });
        }

        function addTodo() {
            const text = newTodoInput.value.trim();
            if (!text) {
                newTodoInput.focus();
                return;
            }
            todos.push({ text, done: false });
            newTodoInput.value = '';
            renderTodos();
        }

        addTodoButton.addEventListener('click', addTodo);
        newTodoInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') addTodo();
        });

        renderTodos();
    </script>
</body>
</html>
